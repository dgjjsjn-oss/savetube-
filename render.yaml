services:
  - type: web
    name: savetube
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      # Deliberately NOT setting PORT. Render assigns the port its own router
      # listens on and passes it in as PORT. Pinning a different number here
      # makes the app bind one port while Render routes to another, and every
      # request comes back as 502 Bad Gateway. The app already reads
      # process.env.PORT, so Render's value is used as-is.

      # Render puts the site behind its own proxy, so the real visitor address
      # arrives in X-Forwarded-For. Without this, every visitor looks like the
      # same proxy address and the request throttle would punish all of them
      # together. This is only safe because we really are behind that proxy.
      - key: TRUST_PROXY
        value: "1"

      # Two downloads at once keeps the free instance responsive.
      - key: MAX_CONCURRENT
        value: "2"

      # Requests per minute per visitor. One page load costs about ten, so this
      # still leaves a normal visitor plenty of room.
      - key: RATE_LIMIT
        value: "60"

      # Salt for hashing visitor addresses. Generated once and kept, so counts
      # stay consistent across restarts and no raw address is ever stored.
      - key: IP_SALT
        generateValue: true

      # The private key for /go-stats and /messages. Render fills this in.
      - key: STATS_KEY
        generateValue: true

      # Where contact-form messages are relayed. Leave empty to store them
      # only in data/messages.json, which is wiped on every restart.
      - key: CONTACT_WEBHOOK
        sync: false
