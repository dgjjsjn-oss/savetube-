<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>mobile audit</title></head>
<body>
<pre id="out">running...</pre>
<div id="stage"></div>
<script>
var WIDTHS = [320, 360, 375, 414, 480, 768, 834, 1024, 1440];
var results = [];
var log = [];

function run() {
  var out = document.getElementById("out");
  out.textContent = log.join("\n") + "\n";

  if (!WIDTHS.length) {
    out.textContent = log.join("\n");
    document.title = "DONE";
    return;
  }

  var w = WIDTHS.shift();
  var stage = document.getElementById("stage");
  stage.innerHTML = "";

  var f = document.createElement("iframe");
  f.style.cssText = "width:" + w + "px;height:900px;border:0;position:absolute;left:-20000px;";
  f.src = "/";
  stage.appendChild(f);

  f.onload = function () {
    // give the page's own JS a moment to finish first render
    setTimeout(function () {
      var d, win;
      try { d = f.contentDocument; win = f.contentWindow; } catch (e) {
        log.push("W" + w + "  -> could not read: " + e.message);
        out.textContent = log.join("\n");
        run();
        return;
      }

      var docEl = d.documentElement;
      var body = d.body;
      var scrollW = Math.max(docEl.scrollWidth, body ? body.scrollWidth : 0);
      var overflow = scrollW - w;

      // elements sticking out past the right edge
      var offenders = [];
      var all = d.querySelectorAll("body *");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        var r = el.getBoundingClientRect();
        if (r.width === 0 || r.height === 0) continue;
        if (r.right > w + 1.5) {
          var tag = el.tagName.toLowerCase();
          var cls = (el.className && typeof el.className === "string") ? "." + el.className.split(" ")[0] : "";
          var id = el.id ? "#" + el.id : "";
          var s = tag + id + cls;
          if (offenders.indexOf(s) === -1) offenders.push(s + " (right=" + Math.round(r.right) + ")");
        }
      }

      // tap targets: interactive controls smaller than 40px in either axis
      var small = [];
      var ctrls = d.querySelectorAll("button, a, input, select, textarea, [role=button]");
      for (var j = 0; j < ctrls.length; j++) {
        var c = ctrls[j];
        var cs = win.getComputedStyle(c);
        if (cs.display === "none" || cs.visibility === "hidden") continue;
        var rr = c.getBoundingClientRect();
        if (rr.width === 0 || rr.height === 0) continue;
        if (rr.height < 40 || rr.width < 40) {
          var label = (c.textContent || c.value || c.id || c.tagName).trim().slice(0, 26);
          var sig = c.tagName + "#" + (c.id || "") + ":" + label;
          if (small.indexOf(sig) === -1) {
            small.push(sig + " [" + Math.round(rr.width) + "x" + Math.round(rr.height) + "]");
          }
        }
      }

      var verdict = overflow > 2 ? "HORIZONTAL SCROLL" : "fits";
      log.push(
        "W" + w + "  " + verdict +
        "  scrollW=" + scrollW +
        "  overflow=" + overflow + "px" +
        "  offenders=" + offenders.length +
        "  smallTargets=" + small.length
      );
      if (offenders.length) log.push("      OVER: " + offenders.slice(0, 5).join(", "));
      if (small.length) log.push("      SMALL: " + small.slice(0, 6).join(" | "));

      out.textContent = log.join("\n");
      run();
    }, 1200);
  };
}

run();
</script>
</body>
</html>
